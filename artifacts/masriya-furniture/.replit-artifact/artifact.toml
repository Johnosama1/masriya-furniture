kind = "web"
previewPath = "/"
title = "المصرية للأثاث الراقي"
version = "1.0.0"
id = "artifacts/masriya-furniture"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23355

[services.development]
run = "pnpm --filter @workspace/masriya-furniture run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/masriya-furniture", "run", "build" ]
publicDir = "artifacts/masriya-furniture/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23355"
BASE_PATH = "/"
